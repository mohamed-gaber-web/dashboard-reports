<div class="flex flex-col items-center justify-center gap-4 px-6 py-16 text-center">
  <span class="empty-icon">
    <app-icon [path]="icon()" [size]="24" />
  </span>
  <div class="flex flex-col gap-1.5">
    <h3 class="text-base font-semibold text-content">{{ title() }}</h3>
    @if (message(); as m) {
      <p class="max-w-sm text-sm leading-relaxed text-muted">{{ m }}</p>
    }
  </div>
  @if (retryLabel(); as label) {
    <button type="button" (click)="retry.emit()" class="btn-primary mt-1">
      {{ label }}
    </button>
  }
</div>
