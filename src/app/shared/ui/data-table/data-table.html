<div class="overflow-hidden" [class.card]="!bare()" [class.card-lg]="!bare()" [class.tbl-bare]="bare()">
  <div
    class="tbl-scroll overflow-auto"
    [class.is-scrolled]="scrolled()"
    [style.maxHeight]="maxHeight()"
    (scroll)="onScroll($event)"
  >
    <table class="tbl" [class.zebra]="zebra()">
      <thead>
        <tr>
          @for (col of columns(); track col.key) {
            <th [class]="alignClass(col)">{{ col.header }}</th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of rows(); track $index) {
          <tr>
            @for (col of columns(); track col.key) {
              <td [class]="alignClass(col)">
                @if (col.kind === 'badge') {
                  <app-status-badge [label]="display(row, col)" [tone]="tone(row, col)" />
                } @else {
                  <span>{{ display(row, col) }}</span>
                }
              </td>
            }
          </tr>
        } @empty {
          <tr class="empty-row">
            <td [attr.colspan]="columns().length" class="px-4 py-12 text-center text-sm text-faint">
              {{ emptyMessage() }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
