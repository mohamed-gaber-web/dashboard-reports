<nav class="sidebar">
  <div class="brand">
    @if (branding.logo(); as logo) {
      <img [src]="logo" alt="Logo" class="brand-mark" />
    } @else {
      <span class="brand-mark">
        <app-icon [path]="icons.dashboard" [size]="18" />
      </span>
    }
    <div class="flex min-w-0 flex-col leading-tight">
      <span class="truncate text-sm font-semibold text-white">{{ branding.appName() }}</span>
      <span class="text-xs text-white/50">Operations</span>
    </div>
  </div>

  <a routerLink="/dashboard" routerLinkActive="is-active" (click)="navigate.emit()" class="nav-link">
    <app-icon [path]="icons.dashboard" [size]="18" />
    <span>Overview</span>
  </a>

  <!--
    AI Analyst and AI Report Builder are hidden from the nav for now.

    Hidden, not removed: both routes are still registered in `app.routes.ts` and
    both features still build and ship, so `/ai/analyst` and `/ai/report-builder`
    remain reachable by URL. Uncomment the two blocks below to bring them back —
    nothing else needs changing, and `aiIcon` / `reportBuilderIcon` are still
    declared on the component for exactly that reason.
  -->
  <!--
  <a routerLink="/ai/analyst" routerLinkActive="is-active" (click)="navigate.emit()" class="nav-link">
    <app-icon [path]="aiIcon" [size]="18" />
    <span class="flex-1">AI Analyst</span>
  </a>
  -->

  <a
    routerLink="/ai/chat-reports"
    routerLinkActive="is-active"
    (click)="navigate.emit()"
    class="nav-link"
  >
    <app-icon [path]="chatReportIcon" [size]="18" />
    <span class="flex-1">Chat Reports</span>
  </a>

  <!--
  <a
    routerLink="/ai/report-builder"
    routerLinkActive="is-active"
    (click)="navigate.emit()"
    class="nav-link"
  >
    <app-icon [path]="reportBuilderIcon" [size]="18" />
    <span class="flex-1">AI Report Builder</span>
    <span class="nav-badge">New</span>
  </a>
  -->

  <p class="nav-section">Modules</p>

  @for (group of groups(); track group.id) {
    <button
      type="button"
      class="nav-link nav-group"
      (click)="toggle(group.id)"
      [attr.aria-expanded]="isOpen(group.id)"
    >
      <app-icon [path]="group.icon" [size]="18" />
      <span class="flex-1 text-left">{{ group.title }}</span>
      <span class="chevron" [class.chevron-open]="isOpen(group.id)">
        <app-icon [path]="icons.chevron" [size]="16" />
      </span>
    </button>

    @if (isOpen(group.id)) {
      <div class="nav-children">
        @for (child of group.children; track child.id) {
          <a
            [routerLink]="'/' + child.route"
            routerLinkActive="is-active"
            (click)="navigate.emit()"
            class="nav-link nav-child"
          >
            <app-icon [path]="child.icon" [size]="15" />
            <span>{{ child.title }}</span>
          </a>
        }
      </div>
    }
  }

  <div class="nav-footer">
    <a routerLink="/settings" routerLinkActive="is-active" (click)="navigate.emit()" class="nav-link">
      <app-icon [path]="settingsIcon" [size]="18" />
      <span>Settings</span>
    </a>
  </div>
</nav>
