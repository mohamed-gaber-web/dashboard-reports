<div class="overflow-hidden" [class.card]="!bare()" [class.card-lg]="!bare()" [class.tbl-bare]="bare()">
  <div
    class="tbl-scroll overflow-auto"
    [class.is-scrolled]="scrolled()"
    [style.maxHeight]="maxHeight()"
    (scroll)="onScroll($event)"
  >
    <table class="tbl" [class.zebra]="zebra()">
      <thead>
        <tr>
          @for (col of columns(); track col.key) {
            <th [class]="alignClass(col)" [attr.aria-sort]="ariaSort(col)">
              @if (canSort(col)) {
                <!--
                  A button, not a click handler on the <th> — sorting has to be
                  reachable by keyboard, and a real button gets that plus the
                  focus ring for free.
                -->
                <button type="button" class="tbl-sort" (click)="toggleSort(col)">
                  <span>{{ col.header }}</span>
                  <span
                    class="tbl-sort-icon"
                    [class.is-active]="sortDirection(col) !== null"
                    aria-hidden="true"
                  >
                    @switch (sortDirection(col)) {
                      @case ('asc') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                          <path d="m6 15 6-6 6 6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                      }
                      @case ('desc') {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                          <path d="m6 9 6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                      }
                      @default {
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                          <path d="m7 10 5-5 5 5M7 14l5 5 5-5" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                      }
                    }
                  </span>
                </button>
              } @else {
                {{ col.header }}
              }
            </th>
          }
        </tr>
      </thead>
      <tbody>
        @for (row of displayRows(); track $index) {
          <tr>
            @for (col of columns(); track col.key) {
              <td [class]="alignClass(col)">
                @if (col.kind === 'badge') {
                  <app-status-badge [label]="display(row, col)" [tone]="tone(row, col)" />
                } @else {
                  <span>{{ display(row, col) }}</span>
                }
              </td>
            }
          </tr>
        } @empty {
          <tr class="empty-row">
            <td [attr.colspan]="columns().length" class="px-4 py-12 text-center text-sm text-faint">
              {{ emptyMessage() }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
