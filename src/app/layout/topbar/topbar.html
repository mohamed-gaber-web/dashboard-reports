<header class="topbar">
  <button type="button" (click)="menu.emit()" class="icon-btn lg:hidden" aria-label="Open navigation">
    <app-icon [path]="icon.menu" [size]="20" />
  </button>

  <!--
    Breadcrumb. Resolved from the report registry, so it names the current
    screen rather than repeating the app name back at the user.
  -->
  <nav class="crumbs" aria-label="Breadcrumb">
    @if (crumb().section; as section) {
      <span class="crumb-section">{{ section }}</span>
      <span class="crumb-sep" aria-hidden="true">
        <app-icon [path]="icon.chevron" [size]="14" />
      </span>
    }
    <span class="crumb-current" aria-current="page">{{ crumb().title }}</span>
  </nav>

  <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
    <!--
      Connection status. The dot carries a label as well as a colour, so it is
      readable without colour vision.
    -->
    <span class="status-chip" [class.status-chip-live]="connected()">
      <span class="status-dot" [class.status-dot-live]="connected()"></span>
      <span class="hidden sm:inline">{{ connected() ? 'D365 connected' : 'Connecting…' }}</span>
    </span>

    <a routerLink="/settings" class="icon-btn" aria-label="Settings">
      <app-icon [path]="icon.settings" [size]="19" />
    </a>

    <button
      type="button"
      (click)="toggleTheme()"
      class="icon-btn theme-btn"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      <app-icon [path]="isDark() ? icon.sun : icon.moon" [size]="19" />
    </button>
  </div>
</header>
