<section
  class="chart-card flex h-full flex-col"
  [class.chart-card-framed]="variant() === 'card'"
  [class.chart-card-plain]="variant() === 'plain'"
>
  <header class="flex items-start justify-between gap-3">
    <div class="flex min-w-0 flex-col gap-0.5">
      <h3 class="text-sm font-semibold text-content">{{ title() }}</h3>
      @if (subtitle(); as s) {
        <p class="text-xs text-faint">{{ s }}</p>
      }
    </div>
    <ng-content select="[cardAction]" />
  </header>
  <div class="min-h-0 flex-1">
    <ng-content />
  </div>
</section>
